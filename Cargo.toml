[workspace]
resolver = "2"
members = [
    "crates/bc-core",
    "crates/bc-metadata",
    "crates/bc-thumbnails",
    "crates/bc-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cmspeedau/BridgeCraft"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
notify = "6"
walkdir = "2"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `webp-encoder` adds the WebP encoder used by the export pipeline; the
# `webp` feature alone is decoder-only. The encoder arrives via the `webp`
# crate, which statically links the vendored (BSD-3-Clause) libwebp C code —
# permissive, compiled from source at build time, listed in
# THIRD_PARTY_LICENSES.md.
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp", "webp-encoder", "tiff", "bmp"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Drives a locally installed `ffmpeg` binary; no FFmpeg libraries are linked
# or bundled. The download feature is disabled on purpose: BridgeCraft never
# fetches binaries at build or run time.
ffmpeg-sidecar = { version = "2.7", default-features = false }
# Dynamic bindings to a user-provided libpdfium; nothing is linked or bundled.
# `image_latest` is disabled to avoid a second copy of the `image` crate: raw
# RGBA is all the thumbnail pipeline needs.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
# Runtime loading of a user-provided libraw for camera RAW thumbnails.
libloading = "0.8"
eframe = "0.27"
egui = "0.27"

[profile.release]
lto = "thin"
codegen-units = 1
