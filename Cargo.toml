[workspace]
resolver = "2"
members = [
    "crates/bc-core",
    "crates/bc-metadata",
    "crates/bc-thumbnails",
    "crates/bc-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cmspeedau/BridgeCraft"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
notify = "6"
walkdir = "2"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
rusqlite = { version = "0.31", features = ["bundled"] }
eframe = "0.27"
egui = "0.27"

[profile.release]
lto = "thin"
codegen-units = 1
