name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (video thumbnail tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Pdfium (PDF thumbnail tests)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8138/pdfium-linux-x64.tgz"
          echo "d6b1e28950a0392590d79bbdbb7eb19686872b688f8a36f170acb19e41473113  /tmp/pdfium.tgz" | sha256sum -c -
          sudo mkdir -p /opt/pdfium
          sudo tar -xzf /tmp/pdfium.tgz -C /opt/pdfium
          echo "PDFIUM_PATH=/opt/pdfium/lib" >> "$GITHUB_ENV"
      - name: Install LibRaw (camera RAW thumbnail tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev
      - name: Fetch RAW sample (CC0, raw.pixls.us)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/sample.dng "https://raw.pixls.us/getfile.php/6584/nice/Canon%20-%20EOS-1D%20X%20-%201%3A1.dng"
          echo "0c07c60ceda8e724534ed24ae56ec73f6040a3c9040127fcba7dc3305e59396b  /tmp/sample.dng" | sha256sum -c -
          echo "RAW_SAMPLE=/tmp/sample.dng" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build (debug)
        run: cargo build --workspace --locked
      - name: Build (release)
        run: cargo build --workspace --release --locked
